## offboarding-flow nginx 反向代理 + 静态前端服务
## REQ: DEPLOY-01 / DEPLOY-02 — PRD §10.0.2
## PITFALLS #13（log_format 不记录 query string 防 token 泄露）
## PITFALLS #20（location ^~ 优先级 — /api/ 不被 location / 吞掉）

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    ## PITFALLS #13 — access log 不记录 query string，防 token=xxx 泄露
    ## 标准 combined 格式包含 $request（含 query string），这里用 $uri 屏蔽
    log_format  access_no_query  '$remote_addr - $remote_user [$time_local] '
                                 '"$request_method $uri $server_protocol" '
                                 '$status $body_bytes_sent '
                                 '"$http_referer" "$http_user_agent"';
    access_log  /var/log/nginx/access.log  access_no_query;

    ## gzip 压缩静态资源
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml;

    ## upstream — flow-api 在同一 docker 网络
    upstream flow_api {
        server flow-api:8000;
        keepalive 16;
    }

    server {
        listen       80 default_server;
        server_name  192.168.2.44;

        ## ------------------------------------------------------------------
        ## 1. API 反代 — ^~ 优先级高于正则，确保 /api/* 不被 SPA 兜底吞掉
        ## ------------------------------------------------------------------
        location ^~ /api/ {
            proxy_pass http://flow_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            ## 内网调用给宽松超时，LLM 摘要可能耗时
            proxy_connect_timeout 10s;
            proxy_send_timeout    90s;
            proxy_read_timeout    90s;

            ## 关 buffer，让 SSE / 流式响应实时
            proxy_buffering off;
        }

        ## ------------------------------------------------------------------
        ## 2. WebSocket 透传 — /ws/ 备用（v1 暂未启用）
        ## ------------------------------------------------------------------
        location ^~ /ws/ {
            proxy_pass http://flow_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_read_timeout 3600s;
        }

        ## ------------------------------------------------------------------
        ## 3. 静态前端（Next.js output: 'export' 产物）
        ## ------------------------------------------------------------------
        ## 动态路由用 placeholder/index.html 做 fallback（NodePageClient 等会
        ## 用 useParams 拿到真实 uuid）；其他路径 SPA 兜底回首页。
        ## ------------------------------------------------------------------
        location ~ ^/flow/[^/]+/node/[^/]+/?$ {
            root /usr/share/nginx/html;
            try_files $uri $uri/index.html /flow/placeholder/node/placeholder/index.html;
        }
        location ~ ^/flow/[^/]+/applicant-confirm/?$ {
            root /usr/share/nginx/html;
            try_files $uri $uri/index.html /flow/placeholder/applicant-confirm/index.html;
        }
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri.html $uri/index.html /index.html;
        }

        ## ------------------------------------------------------------------
        ## 4. /health 内网探针（容器健康检查用，不走 flow-api）
        ## ------------------------------------------------------------------
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        ## ------------------------------------------------------------------
        ## 5. 错误页（生产环境隐藏 nginx 版本 + 提示语）
        ## ------------------------------------------------------------------
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
