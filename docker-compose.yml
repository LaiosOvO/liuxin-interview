services:
  offboarding-postgres:
    image: postgres:18-alpine
    container_name: offboarding-postgres
    environment:
      POSTGRES_USER: flow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须在 .env 设置}
      POSTGRES_DB: offboarding
    ports:
      - "5433:5432"
    volumes:
      # PostgreSQL 18+ 要求 mount 到 /var/lib/postgresql（不是 /data 子目录），见 docker-library/postgres#1259
      - /data/offboarding/postgres-data:/var/lib/postgresql
      - ./deploy/init-db.sql:/docker-entrypoint-initdb.d/01-init-schemas.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flow -d offboarding"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - offboarding-net

  offboarding-redis:
    image: redis:latest
    container_name: offboarding-redis
    ports:
      - "6380:6379"
    volumes:
      - /data/offboarding/redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - offboarding-net

  flow-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: offboarding-flow-api:latest
    container_name: offboarding-flow-api
    ports:
      - "8000:8000"
    # 让 .env 所有变量进容器（SMTP / GLM / MATTERMOST_* 等），不用在 environment 里逐一列
    env_file:
      - .env
    environment:
      APP_MODE: ${APP_MODE:-demo}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DSN: postgresql+asyncpg://flow:${POSTGRES_PASSWORD}@offboarding-postgres:5432/offboarding
      LANGGRAPH_PG_CONNINFO: postgres://flow:${POSTGRES_PASSWORD}@offboarding-postgres:5432/offboarding
      REDIS_URL: redis://offboarding-redis:6379/0
      # Phase 6（SUMMARY R1）: 深链基址走 nginx :80（无 :3000，nginx 反代 /api → flow-api）
      DEEPLINK_BASE_URL: ${DEEPLINK_BASE_URL:-http://192.168.2.44}
      # Phase 4.5（PRD §18 加分项）: AutoNode 外部归档服务
      ARCHIVE_SERVICE_URL: ${ARCHIVE_SERVICE_URL:-http://mock-archive-service:5000/archive}
      # Phase 6（NOTI-05 / TIMEOUT-01）: 节点 SLA 与演示快速触发覆盖
      NODE_TIMEOUT_HOURS: ${NODE_TIMEOUT_HOURS:-24}
      DEMO_TIMEOUT_OVERRIDE_HOURS: ${DEMO_TIMEOUT_OVERRIDE_HOURS:-}
    depends_on:
      offboarding-postgres:
        condition: service_healthy
      offboarding-redis:
        condition: service_healthy
      mock-archive-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - offboarding-net

  # Phase 4.5（PRD §18 加分项）: mock 外部归档服务（演示 AutoNode 调外部 HTTP API）
  mock-archive-service:
    build:
      context: ./mock-archive-service
    image: offboarding-mock-archive:latest
    container_name: offboarding-mock-archive
    ports:
      - "5050:5000"
    environment:
      ARCHIVE_DATA_DIR: /data/archive
    volumes:
      - /data/offboarding/archive:/data/archive
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - offboarding-net

  # Outline knowledge base —— 会议纪要协作文档
  outline:
    image: outlinewiki/outline:latest
    container_name: offboarding-outline
    ports:
      - "3001:3000"
    environment:
      SECRET_KEY: ${OUTLINE_SECRET_KEY:?OUTLINE_SECRET_KEY 必须 openssl rand -hex 32}
      UTILS_SECRET: ${OUTLINE_UTILS_SECRET:?OUTLINE_UTILS_SECRET 必须 openssl rand -hex 32}
      DATABASE_URL: postgres://flow:${POSTGRES_PASSWORD}@offboarding-postgres:5432/outline
      PGSSLMODE: disable
      REDIS_URL: redis://offboarding-redis:6379/1
      URL: ${OUTLINE_URL:-http://192.168.2.44:3001}
      PORT: 3000
      FORCE_HTTPS: "false"
      FILE_STORAGE: local
      FILE_STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/data
      FILE_STORAGE_UPLOAD_MAX_SIZE: "262144000"
      # SMTP — magic link 登录用 QQ 邮箱
      SMTP_HOST: ${SMTP_HOST:-smtp.qq.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_USER}
      SMTP_REPLY_EMAIL: ${SMTP_USER}
      SMTP_SECURE: "true"
      # 默认主语言中文
      DEFAULT_LANGUAGE: zh_CN
    volumes:
      - /data/outline:/var/lib/outline/data
    depends_on:
      offboarding-postgres:
        condition: service_healthy
      offboarding-redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - offboarding-net

  # Phase 6（DEPLOY-01/02/03）: nginx 反代 + 静态前端
  # 反代 /api/ → flow-api:8000；根路径 serve 前端静态产物；监听 80 端口
  # Phase 5 frontend build 完成后挂载 frontend/out → /usr/share/nginx/html
  nginx:
    build:
      context: ./deploy/nginx
    image: offboarding-nginx:latest
    container_name: offboarding-nginx
    ports:
      - "80:80"
    volumes:
      # Phase 5 前端构建产物（pnpm build → frontend/out/）。
      # 若 frontend/out 不存在容器会启动但只 serve 占位 index.html；
      # Phase 5 完成后无需重建镜像，重启 nginx 即可热加载产物。
      - ./frontend/out:/usr/share/nginx/html:ro
    depends_on:
      flow-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - offboarding-net

  # Phase 6 可选辅助：frontend-build 一次性容器
  # 用于 CI / 部署机不装 Node 22 + pnpm 11 时，直接 docker compose run frontend-build
  # 默认不随 up -d 启动（profiles: build 隔离）
  frontend-build:
    image: node:22-alpine
    container_name: offboarding-frontend-build
    profiles:
      - build
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: >
      sh -c "
        corepack enable &&
        corepack prepare pnpm@11.1.1 --activate &&
        pnpm install --frozen-lockfile &&
        pnpm build
      "
    networks:
      - offboarding-net

  # ===========================================================================
  # Phase 8 / HULY-01 — Huly Platform Stack（opt-in via --profile huly-stack）
  # ---------------------------------------------------------------------------
  # 默认 docker compose up -d 不启动以下任何 service（profiles: ["huly-stack"]）。
  # 现有 5 个 offboarding service（postgres / redis / flow-api / nginx / outline）
  # 的行为 0 变化。
  #
  # 启动方法：docker compose --profile huly-stack up -d
  # 详见：deploy/huly/HULY_IMAGES.md
  # ===========================================================================

  # ---- 基础设施层（4 个）-----------------------------------------------------

  huly-cockroach:
    image: cockroachdb/cockroach:latest-v24.2
    container_name: offboarding-huly-cockroach
    profiles: ["huly-stack"]
    command: start-single-node --insecure --accept-sql-without-tls --listen-addr=0.0.0.0:26257 --http-addr=0.0.0.0:8080
    ports:
      - "26257:26257"   # SQL
      - "8888:8080"     # Admin UI
    volumes:
      - huly-cockroach-data:/cockroach/cockroach-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - offboarding-net

  huly-redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    container_name: offboarding-huly-redpanda
    profiles: ["huly-stack"]
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://huly-redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://huly-redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr huly-redpanda:33145
      - --advertise-rpc-addr huly-redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    ports:
      - "19092:19092"   # Kafka external
      - "19644:9644"    # Admin API
    volumes:
      - huly-redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - offboarding-net

  huly-elastic:
    image: elasticsearch:7.14.2
    container_name: offboarding-huly-elastic
    profiles: ["huly-stack"]
    command: |
      /bin/sh -c "./bin/elasticsearch-plugin list | grep -q ingest-attachment || yes | ./bin/elasticsearch-plugin install --silent ingest-attachment;
      /usr/local/bin/docker-entrypoint.sh eswrapper"
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1024m -Xmx1024m
      - http.cors.enabled=true
      - http.cors.allow-origin=*
    ports:
      - "19200:9200"
    volumes:
      - huly-elastic-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - offboarding-net

  huly-minio:
    image: minio/minio:latest
    container_name: offboarding-huly-minio
    profiles: ["huly-stack"]
    # 注意：端口 9091/9092 避让项目原 MinIO 占用的 9000/9001
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${HULY_MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${HULY_MINIO_PASSWORD:-minioadmin}
    ports:
      - "9091:9000"     # S3 API
      - "9092:9001"     # Console
    volumes:
      - huly-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - offboarding-net

  # ---- 业务服务层（11 个 hardcoreeng/* — 统一 ${HULY_VERSION}）---------------

  huly-account:
    image: hardcoreeng/account:${HULY_VERSION:-v0.7.423}
    container_name: offboarding-huly-account
    profiles: ["huly-stack"]
    environment:
      - SERVER_PORT=3000
      # 注意：${HULY_SERVER_SECRET} 不带 :? 强校验（避免默认 profile 启动时被这一行卡住）
      # 启动 huly-stack 前必须填 .env；详见 deploy/huly/README.md
      - SERVER_SECRET=${HULY_SERVER_SECRET}
      - ACCOUNT_PORT=3000
      - DB_URL=postgresql://root@huly-cockroach:26257/defaultdb?sslmode=disable
      - TRANSACTOR_URL=ws://huly-transactor:3333
      - STORAGE_CONFIG=minio|huly-minio?accessKey=${HULY_MINIO_USER:-minioadmin}&secretKey=${HULY_MINIO_PASSWORD:-minioadmin}
      - FRONT_URL=http://192.168.2.44:8087
      - STATS_URL=http://huly-stats:4900
      - ACCOUNTS_URL=http://huly-account:3000
      - MODEL_ENABLED=*
      - QUEUE_CONFIG=huly-redpanda:9092
    ports:
      - "3007:3000"
    depends_on:
      huly-cockroach:
        condition: service_healthy
      huly-minio:
        condition: service_healthy
      huly-redpanda:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - offboarding-net

  huly-transactor:
    image: hardcoreeng/transactor:${HULY_VERSION:-v0.7.423}
    container_name: offboarding-huly-transactor
    profiles: ["huly-stack"]
    environment:
      - SERVER_PORT=3333
      - SERVER_SECRET=${HULY_SERVER_SECRET}
      - DB_URL=postgresql://root@huly-cockroach:26257/defaultdb?sslmode=disable
      - STORAGE_CONFIG=minio|huly-minio?accessKey=${HULY_MINIO_USER:-minioadmin}&secretKey=${HULY_MINIO_PASSWORD:-minioadmin}
      - FRONT_URL=http://192.168.2.44:8087
      - ACCOUNTS_URL=http://huly-account:3000
      - FULLTEXT_URL=http://huly-fulltext:4700
      - STATS_URL=http://huly-stats:4900
      - QUEUE_CONFIG=huly-redpanda:9092
      - LAST_NAME_FIRST=true
    ports:
      - "3008:3333"
    depends_on:
      - huly-account
    restart: unless-stopped
    networks:
      - offboarding-net

  huly-collaborator:
    image: hardcoreeng/collaborator:${HULY_VERSION:-v0.7.423}
    container_name: offboarding-huly-collaborator
    profiles: ["huly-stack"]
    environment:
      - COLLABORATOR_PORT=3078
      - SECRET=${HULY_SERVER_SECRET}
      - ACCOUNTS_URL=http://huly-account:3000
      - STATS_URL=http://huly-stats:4900
      - STORAGE_CONFIG=minio|huly-minio?accessKey=${HULY_MINIO_USER:-minioadmin}&secretKey=${HULY_MINIO_PASSWORD:-minioadmin}
    ports:
      - "3009:3078"
    depends_on:
      - huly-transactor
    restart: unless-stopped
    networks:
      - offboarding-net

  huly-workspace:
    image: hardcoreeng/workspace:${HULY_VERSION:-v0.7.423}
    container_name: offboarding-huly-workspace
    profiles: ["huly-stack"]
    environment:
      - SERVER_SECRET=${HULY_SERVER_SECRET}
      - DB_URL=postgresql://root@huly-cockroach:26257/defaultdb?sslmode=disable
      - ACCOUNTS_DB_URL=postgresql://root@huly-cockroach:26257/defaultdb?sslmode=disable
      - TRANSACTOR_URL=ws://huly-transactor:3333
      - STORAGE_CONFIG=minio|huly-minio?accessKey=${HULY_MINIO_USER:-minioadmin}&secretKey=${HULY_MINIO_PASSWORD:-minioadmin}
      - MODEL_ENABLED=*
      - ACCOUNTS_URL=http://huly-account:3000
      - STATS_URL=http://huly-stats:4900
      - QUEUE_CONFIG=huly-redpanda:9092
    depends_on:
      - huly-transactor
    restart: unless-stopped
    networks:
      - offboarding-net

  huly-fulltext:
    image: hardcoreeng/fulltext:${HULY_VERSION:-v0.7.423}
    container_name: offboarding-huly-fulltext
    profiles: ["huly-stack"]
    environment:
      - SERVER_SECRET=${HULY_SERVER_SECRET}
      - DB_URL=postgresql://root@huly-cockroach:26257/defaultdb?sslmode=disable
      - FULLTEXT_DB_URL=http://huly-elastic:9200
      - ELASTIC_INDEX_NAME=huly_storage_index
      - STORAGE_CONFIG=minio|huly-minio?accessKey=${HULY_MINIO_USER:-minioadmin}&secretKey=${HULY_MINIO_PASSWORD:-minioadmin}
      - REKONI_URL=http://huly-rekoni:4004
      - ACCOUNTS_URL=http://huly-account:3000
      - STATS_URL=http://huly-stats:4900
      - QUEUE_CONFIG=huly-redpanda:9092
    depends_on:
      - huly-elastic
      - huly-account
    restart: unless-stopped
    networks:
      - offboarding-net

  huly-stats:
    image: hardcoreeng/stats:${HULY_VERSION:-v0.7.423}
    container_name: offboarding-huly-stats
    profiles: ["huly-stack"]
    environment:
      - PORT=4900
      - SERVER_SECRET=${HULY_SERVER_SECRET}
    restart: unless-stopped
    networks:
      - offboarding-net

  huly-rekoni:
    image: hardcoreeng/rekoni-service:${HULY_VERSION:-v0.7.423}
    container_name: offboarding-huly-rekoni
    profiles: ["huly-stack"]
    environment:
      - SECRET=${HULY_SERVER_SECRET}
    deploy:
      resources:
        limits:
          memory: 500M
    restart: unless-stopped
    networks:
      - offboarding-net

  huly-kvs:
    image: hardcoreeng/hulykvs:${HULY_VERSION:-v0.7.423}
    container_name: offboarding-huly-kvs
    profiles: ["huly-stack"]
    environment:
      - HULY_DB_CONNECTION=postgresql://root@huly-cockroach:26257/defaultdb?sslmode=disable
      - HULY_TOKEN_SECRET=${HULY_SERVER_SECRET}
    ports:
      - "8094:8094"
    depends_on:
      huly-cockroach:
        condition: service_started
    restart: unless-stopped
    networks:
      - offboarding-net

  # huly-love：视频通话信令（v1 可选）— 若不需视频通话可注释整段
  huly-love:
    image: hardcoreeng/love:${HULY_VERSION:-v0.7.423}
    container_name: offboarding-huly-love
    profiles: ["huly-stack"]
    environment:
      - SECRET=${HULY_SERVER_SECRET}
      - ACCOUNTS_URL=http://huly-account:3000
      - STATS_URL=http://huly-stats:4900
    restart: unless-stopped
    networks:
      - offboarding-net

  huly-print:
    image: hardcoreeng/print:${HULY_VERSION:-v0.7.423}
    container_name: offboarding-huly-print
    profiles: ["huly-stack"]
    environment:
      - SECRET=${HULY_SERVER_SECRET}
      - STORAGE_CONFIG=minio|huly-minio?accessKey=${HULY_MINIO_USER:-minioadmin}&secretKey=${HULY_MINIO_PASSWORD:-minioadmin}
    restart: unless-stopped
    networks:
      - offboarding-net

  huly-front:
    image: hardcoreeng/front:${HULY_VERSION:-v0.7.423}
    container_name: offboarding-huly-front
    profiles: ["huly-stack"]
    environment:
      - SERVER_PORT=8080
      - SERVER_SECRET=${HULY_SERVER_SECRET}
      - ACCOUNTS_URL=http://192.168.2.44:3007
      - ACCOUNTS_URL_INTERNAL=http://huly-account:3000
      - REKONI_URL=http://huly-rekoni:4004
      - STATS_URL=http://huly-stats:4900
      - UPLOAD_URL=/files
      - ELASTIC_URL=http://huly-elastic:9200
      - COLLABORATOR_URL=ws://huly-collaborator:3078
      - STORAGE_CONFIG=minio|huly-minio?accessKey=${HULY_MINIO_USER:-minioadmin}&secretKey=${HULY_MINIO_PASSWORD:-minioadmin}
      - TITLE=Huly@laios
      - DEFAULT_LANGUAGE=zh
      - LAST_NAME_FIRST=true
    ports:
      - "8087:8080"
    depends_on:
      - huly-account
      - huly-transactor
      - huly-collaborator
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - offboarding-net

  # ===========================================================================
  # Phase 8 B-full 重构 — huly-bridge sidecar 已废除
  # ---------------------------------------------------------------------------
  # backend/src/offboarding_flow/providers/huly/ 提供 Python TxOperations 完整复刻，
  # 直接走 Huly REST /api/v1/* + Account RPC，不再需要 Node sidecar。
  # 原 backend/sidecars/huly-bridge/ 目录保留作历史参考，可在确认稳定后删除。
  # ===========================================================================

volumes:
  # Huly 持久化卷（profile=huly-stack 启动时按需创建）
  huly-cockroach-data:
  huly-redpanda-data:
  huly-elastic-data:
  huly-minio-data:

networks:
  offboarding-net:
    driver: bridge
